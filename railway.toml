[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Seconds between SIGTERM and SIGKILL on redeploy. Running jobs finish their
# current test case and hand the rest to the next worker; keep this above 60.
drainingSeconds = 90
